[package]
name = "fdmr-py"
description = "Python bindings to the math library, for the model runner (specification section 4.2). The math itself lives only in fdmr-math."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "fdmr_py"
crate-type = ["cdylib"]

[dependencies]
fdmr-math = { path = "../fdmr-math" }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py311"] }

[lints]
workspace = true
