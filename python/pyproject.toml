[project]
name = "fdmr"
version = "0.1.0"
description = "Fischer Delta Model Returns: model runner, model-kind plug-ins, data adapters and local data store"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fdmr_store", "fdmr_adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real public data service (run with -m live)"]
addopts = "-m 'not live'"
