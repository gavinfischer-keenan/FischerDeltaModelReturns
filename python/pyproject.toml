[project]
name = "fdmr"
version = "0.5.0"
description = "Fischer Delta Model Returns: model runner, model-kind plug-ins, data adapters and local data store"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = ["h5py>=3.12", "pypdf>=5", "pyshp>=2.3", "scipy>=1.11", "tifffile>=2024.1"]  # DSM2 and NOAA output (HDF5), Reclamation's Delta Outflow Computation (PDF), DSM2 grid (shapefiles), mesh coarsening, satellite tiles (GeoTIFF)

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fdmr_geo", "fdmr_store", "fdmr_adapters", "fdmr_runner", "fdmr_plugins", "fdmr_plugins.river_routing", "fdmr_plugins.dsm2", "fdmr_plugins.fvcom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real public data service (run with -m live)"]
addopts = "-m 'not live'"
