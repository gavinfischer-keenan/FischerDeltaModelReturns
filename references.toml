# Every source the model draws on, once, in full. Cite one anywhere in the
# repository by its key, as `ref:achete2015`; tools/references.py lists every
# place each is cited (ui/public/references.json, docs/references.md) and fails
# CI if a citation names no entry here or an entry is cited nowhere.
#
# Fields: authors, year, title, kind (paper, book, chapter, report, standard,
# data, software, web), in (journal and volume(issue), pages; or publisher;
# or series), doi or url (at least one), note (optional), and checked: how and
# when the citation itself was confirmed. A DOI is checked against Crossref's
# record of it (tools/references.py --crossref).

[achete2015]
authors = "Achete, F. M., van der Wegen, M., Roelvink, D., and Jaffe, B."
year = 2015
title = "A 2-D process-based model for suspended sediment dynamics: a first step towards ecological modeling"
