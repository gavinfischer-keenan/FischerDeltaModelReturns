# Region package: San Francisco Bay-Delta, Shasta Dam to the Golden Gate (the launch region).
# Data only (specification section 4.1). Reaches are added in detail as each
# phase builds them: the river in Phase 1, the Delta in Phase 2, the Bay in Phase 3.

id = "sf-bay-delta"
name = "San Francisco Bay-Delta, Shasta Dam to the Golden Gate"
timezone = "America/Los_Angeles"
display_units = "us"   # cubic feet per second, feet, miles, degrees Fahrenheit

[[reaches]]
id = "river"
name = "Sacramento River, Keswick Dam to Sacramento"
kind = "river-routing"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "delta"
name = "Sacramento-San Joaquin Delta, to Chipps Island, with Suisun Marsh"
kind = "1d-tidal-network"
flow_source = "dsm2"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "bay"
name = "Suisun Bay to the Golden Gate"
kind = "2d-field"
flow_source = "noaa-ofs:sfbofs"
certainty = { solid_days = 2, floor = 0.2 }

[[reaches]]
id = "canals"
name = "Export canals, from the Delta's pumps"
kind = "canal-network"   # canals.toml; fdmr_runner.canals
certainty = { solid_days = 5, floor = 0.2 }

# The Delta's other rivers, from their dams (issue #4; gauges below).
[[reaches]]
id = "american"
name = "American River, Nimbus Dam to the Sacramento"
kind = "river-routing"
dam = [-121.220039, 38.636145]   # Nimbus Dam (CDEC NAT), re-regulating Folsom's release
joins = "river"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "feather"
name = "Feather River, Thermalito to the Sacramento"
kind = "river-routing"
# Starts where Oroville's water returns to the river below the Thermalito
# complex (CDEC THA, total release). Above it the river carries only the
# low-flow channel's share, which is not reported live.
joins = "river"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "yuba"
name = "Yuba River, Englebright Dam to the Feather"
kind = "river-routing"
joins = "feather"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "bear"
name = "Bear River, below Camp Far West Dam to the Feather"
kind = "river-routing"
joins = "feather"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "mokelumne"
name = "Mokelumne River, Camanche Dam to the Delta"
kind = "river-routing"
mouth = [-121.43101, 38.25478]   # DSM2 node 447, its inflow "moke"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "cosumnes"
name = "Cosumnes River, Michigan Bar to the Delta"
kind = "river-routing"
# The Cosumnes has no large dam: it starts at its first gauge, Michigan Bar.
mouth = [-121.43203, 38.25788]   # DSM2 node 446, its inflow "cosumnes"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "calaveras"
name = "Calaveras River, New Hogan Dam to the Delta"
kind = "river-routing"
mouth = [-121.36938, 37.9668]    # DSM2 node 21, its inflow "calaveras"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "san_joaquin"
name = "San Joaquin River, above the Merced to Vernalis"
kind = "river-routing"
# Not from Friant: below it the river is diverted at Mendota Pool and Sack Dam
# and runs dry or nearly so in stretches, and the water reaching the Merced is
# not Friant's (on 25 Nov 2026: 238 cfs at Gravelly Ford, 12 below the
# Chowchilla Bifurcation). It starts at its first gauge with Friant's
# successor water, above the Merced.
mouth = [-121.25406, 37.66753]   # DSM2 node 17, its inflow "vernalis"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "tuolumne"
name = "Tuolumne River, La Grange Dam to the San Joaquin"
kind = "river-routing"
joins = "san_joaquin"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "stanislaus"
name = "Stanislaus River, Goodwin Dam to the San Joaquin"
kind = "river-routing"
joins = "san_joaquin"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "merced"
name = "Merced River, Crocker-Huffman Dam to the San Joaquin"
kind = "river-routing"
dam = [-120.380196, 37.518223]   # just below Crocker-Huffman Dam (CDEC MBH)
joins = "san_joaquin"
certainty = { solid_days = 5, floor = 0.2 }

[[reaches]]
id = "cache"
name = "Cache Creek, Clear Lake to Yolo"
kind = "river-routing"
# Ends past the Yolo gauge, above the Cache Creek Settling Basin: the Yolo
# Bypass it drains into is not modelled yet, so its water stops there.
certainty = { solid_days = 5, floor = 0.2 }

[[handoffs]]
from = "river"
to = "delta"
at = "Sacramento River inflow to DSM2"
node = 330   # DSM2's junction where the Sacramento enters, at Freeport (its boundary flow "sac")
source = "sac"   # the water-source group (dsm2.toml [fingerprint]) the river's water belongs to

[[handoffs]]
from = "delta"
to = "bay"
at = "Chipps Island line"

[[handoffs]]
from = "delta"
to = "canals"
at = "the Delta model's exports that feed a canal (canals.toml)"

[[handoffs]]
from = "american"
to = "river"
at = "the American's mouth, at Sacramento"

[[handoffs]]
from = "feather"
to = "river"
at = "the Feather's mouth, above Verona"

[[handoffs]]
from = "yuba"
to = "feather"
at = "the Yuba's mouth, at Marysville"

[[handoffs]]
from = "bear"
to = "feather"
at = "the Bear's mouth"

[[handoffs]]
from = "mokelumne"
to = "delta"
at = "DSM2's inflow moke"
node = 447
source = "east"

[[handoffs]]
from = "cosumnes"
to = "delta"
at = "DSM2's inflow cosumnes"
node = 446
source = "east"

[[handoffs]]
from = "calaveras"
to = "delta"
at = "DSM2's inflow calaveras"
node = 21
source = "east"

[[handoffs]]
from = "san_joaquin"
to = "delta"
at = "DSM2's inflow vernalis"
node = 17
source = "sjr"

[[handoffs]]
from = "tuolumne"
to = "san_joaquin"
at = "the Tuolumne's mouth"

[[handoffs]]
from = "stanislaus"
to = "san_joaquin"
at = "the Stanislaus's mouth"

[[handoffs]]
from = "merced"
to = "san_joaquin"
at = "the Merced's mouth"


# River gauges, upstream to downstream (USGS site numbers, confirmed 25 Nov 2026).
# forecast: the River Forecast Center point whose flow forecast continues the gauge
# (CNRFC QINE columns match the USGS gauges at the issue time). The release has
# no forecast: it is held at its last measured value (specification 8.2).
# role: "release" is the upstream boundary; "main" are main-stem calibration and
# routing points; "tributary" are inflows added where they join. Ungauged
# inflows and diversions between main-stem gauges are carried as each
# segment's measured gain or loss.
[[gauges]]
reach = "river"
site = "11370500"
name = "Sacramento R at Keswick"
role = "release"

[[gauges]]
reach = "river"
site = "11372000"
name = "Clear Creek near Igo"
role = "tributary"

[[gauges]]
reach = "river"
site = "11374000"
name = "Cow Creek near Millville"
role = "tributary"

[[gauges]]
reach = "river"
site = "11376000"
name = "Cottonwood Creek near Cottonwood"
role = "tributary"

[[gauges]]
reach = "river"
site = "11376550"
name = "Battle Creek below Coleman Fish Hatchery"
role = "tributary"

[[gauges]]
reach = "river"
site = "11377100"
name = "Sacramento R above Bend Bridge near Red Bluff"
role = "main"
forecast = { source = "cnrfc", group = "UpperSacramento", point = "BDBC1" }

[[gauges]]
reach = "river"
site = "11383500"
name = "Deer Creek near Vina"
role = "tributary"

[[gauges]]
reach = "river"
site = "11389500"
name = "Sacramento R at Colusa"
role = "main"
forecast = { source = "cnrfc", group = "UpperSacramento", point = "CLUC1" }

[[gauges]]
reach = "river"
site = "11390500"
name = "Sacramento R below Wilkins Slough near Grimes"
role = "main"
forecast = { source = "cnrfc", group = "UpperSacramento", point = "WLKC1" }

[[gauges]]
reach = "river"
site = "11407000"
name = "Feather R at Oroville"
role = "tributary"

[[gauges]]
reach = "river"
site = "11421000"
name = "Yuba R near Marysville"
role = "tributary"

[[gauges]]
reach = "river"
site = "11425500"
name = "Sacramento R at Verona"
role = "main"
forecast = { source = "cnrfc", group = "LowerSacramento", point = "VONC1" }

[[gauges]]
reach = "river"
site = "11446500"
name = "American R at Fair Oaks"
role = "tributary"

[[gauges]]
reach = "river"
site = "11447650"
name = "Sacramento R at Freeport"
role = "main"
forecast = { source = "cnrfc", group = "LowerSacramento", point = "FPOC1" }

# ---------------------------------------------------------------------------
# The Delta's other rivers, each from its first dam (specification 3.13; issue
# #4), each a river-routing reach like the Sacramento's from Keswick. Stations
# checked 25-26 Nov 2026 on USGS's NWIS site pages and CDEC's station pages;
# River Forecast Center points against the groups' QINE columns that day.
# Where USGS has no live gauge, the dam operator's or DWR's CDEC station
# serves, placed by the USGS site at the same place where there is one (whose
# field measurements give the channel's shape), else by CDEC's coordinates,
# which the geometry build checks lie on the river.
#   joins: the reach it flows into, met where its main stem reaches that
#   reach's centreline. mouth: where it enters the Delta model, DSM2's inflow
#   junction (node numbers from HYDRO's node_flow_connections).
#   dam: where the reach starts, above its release gauge.

[[gauges]]
reach = "american"
site = "11446500"
name = "American R at Fair Oaks (Nimbus Dam's release)"
role = "release"

[[gauges]]
reach = "feather"
site = "THA"
name = "Feather R, total release below Thermalito (DWR)"
role = "release"
source = "cdec"
parameter = "regulated_release"
duration = "H"
lon = -121.633
lat = 39.450

[[gauges]]
reach = "feather"
site = "GRL"
name = "Feather R near Gridley (DWR)"
role = "main"
source = "cdec"
duration = "E"
usgs_site = "11407150"
forecast = { source = "cnrfc", group = "FeatherYuba", point = "GRIC1" }

[[gauges]]
reach = "feather"
site = "11421000"
name = "Yuba R near Marysville"
