# Goodwin Dam's release is measured live only at Orange Blossom Bridge (CDEC
# OBB, DWR; USGS 11302000 below the dam reports daily, ending Sep 2025). CDEC's
# coordinates for OBB lie in the Delta, so the station is placed at the USGS
# gauge below the dam: the flow between is Goodwin's release.
[[gauges]]
reach = "stanislaus"
site = "OBB"
name = "Stanislaus R at Orange Blossom Bridge (DWR)"
role = "release"
source = "cdec"
duration = "E"
usgs_site = "11302000"
forecast = { source = "cnrfc", group = "SanJoaquin", point = "OBBC1" }

[[gauges]]
