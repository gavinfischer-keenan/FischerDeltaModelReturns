# The basemap extract: west, south, east, north (degrees), and the deepest zoom.
[basemap]
bbox = [-123.25, 37.25, -120.95, 40.98]
maxzoom = 15

# Words that must never appear in engine code (tools/check_seams.py).
[guard]
words = [
  "Sacramento", "San Joaquin", "Shasta", "Keswick", "Suisun", "Martinez",
  "Chipps", "Golden Gate", "Vernalis", "Rio Vista", "Freeport", "Mallard",
  "Montezuma", "Jones Tract", "Grizzly Bay", "Honker Bay", "sfbofs",
]
