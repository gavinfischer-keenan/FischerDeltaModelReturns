# Suspended sediment (issue #16): DSM2's General Transport Model on HYDRO's
# flows (fdmr_plugins.dsm2.sediment, runner/dsm2/gtm-sediment.patch). One class
# of mud, with the calibrated values of Achete, van der Wegen, Roelvink and
# Jaffe (2015, ref:achete2015, section 3.1 and table 1),
# whose Delta model is the closest published to this one:
#   settling velocity ws        0.25 mm/s   (their sensitivity range 0.15-0.38)
#   critical shear for erosion  0.25 Pa     (range 0.125-0.5; the parameter
#                                            their results were most sensitive to;
#                                            replaced below by the Delta's own cores)
#   erosion rate M              1e-4 kg/m2/s (range 2.5e-5 to 1e-2; least sensitive),
#                               in Partheniades' form (ref:partheniades1965)
#   deposition at any shear stress (their section 2.1), and a bed that starts
#   bare (their section 3.4: mud laid everywhere at the start takes years to rework).
# GTM's grain size only enters through its formulas the settings replace; it is
# the Stokes diameter of that settling velocity in 10 degC water,
# sqrt(18 nu ws / ((s - 1) g)) = 0.019 mm, so GTM's own sums agree.
[sediment]
diameter_mm = 0.019

[sediment.scalars]
# Achete et al.'s erosion rate M, kg/m2/s (above).
ero_coef = 0.0001
# Achete et al.'s settling velocity ws, m/s (above).
sed_settling = 0.00025
# The bed's critical shear stress for erosion: 0.13 Pa, the mean of
# Schoellhamer et al.'s erosion-chamber cores in the Delta's own bed
# (ref:schoellhamer2017, Table 3: 0.14 Pa at Franks Tract, 15 cores; 0.11 Pa
# in upper Cache Slough, 10 cores; (15 x 0.14 + 10 x 0.11) / 25 = 0.128), in
# place of Achete et al.'s 0.25 Pa (calibrated for the whole Bay-Delta).
# Checked 27 Nov 2026 over 14 days against all five sediment checks below:
# better at every one (#24).
sed_tau_erosion = 0.13
# Achete et al.'s deposition at any shear stress (above).
sed_deposit_always = true
# A bare bed at the start, kg/m2 (Achete et al., above).
sed_bed_initial = 0.0

# Each inflow's sediment concentration, by DSM2's own names. The Sacramento
# brings about 85% of the Delta's sediment and the San Joaquin 13% (Wright and
# Schoellhamer 2005, ref:wright2005, as cited by Achete et al. 2015, section
# 2.2). The Yolo
# Bypass takes the Sacramento's: its flood water is the Sacramento's, over the
# Fremont and Sacramento weirs, and it has no live sediment gauge. The Delta
# islands' drainage returns bring a constant 20 mg/L, DWR's own figure for its
# DSM2 GTM sediment calibration (ref:dwr2019ar, chapter 4); checked 27 Nov
# 2026 with the 0.13 Pa above, better again at all five checks (#24). The
# eastside streams and treatment plants, the rest, have no live gauge and
# bring none here ("none").
[sediment.inflows]
sac = ["sac", "yolo", "yolo_toe"]
sjr = ["vernalis"]
sea = ["mtz"]
drainage = ["dicu_drain_.*", "bc_150", "bc_151"]
none = ["*"]

[sediment.constants]
# DWR's 20 mg/L in the islands' drainage returns (ref:dwr2019ar, chapter 4; above).
drainage = 20

# Where each series comes from. Turbidity becomes SSC through Achete et al.'s
# relation for that part of the Delta (section 4.5), log10(SSC) =
# a log10(T) + b: north a = 0.85, b = 0.35; southern a = 1.16, b = 0.27. The
# relations are USGS's (personal communication to the authors, 2014) and the
# paper does not say whether its turbidity was FNU or NTU; each gauge's own
# unit is named below, and both are read as the paper's turbidity.
# Of USGS's Delta gauges only Freeport reports turbidity live (checked 26 Nov
# 2026: its "BGC PROJECT" sensor); the rest come from CDEC.
# The sea end uses USGS's own continuous SSC at Benicia Bridge, 4 km up from
# DSM2's Martinez boundary: the mean of its sensors 71 ft and 19 ft above the bed.
[[sediment.water]]
name = "sac"
source = "usgs"
site = "11447650"     # Sacramento R at Freeport, FNU
parameter = "turbidity_fnu_bgc"
relation = { a = 0.85, b = 0.35, area = "north" }
hold = "mean_25h"

[[sediment.water]]
name = "sjr"
source = "cdec"
site = "MSD"          # San Joaquin R at Mossdale Bridge, 20 km below Vernalis, NTU
duration = "E"
parameter = "turbidity_ntu"
relation = { a = 1.16, b = 0.27, area = "southern" }
hold = "mean_25h"

[[sediment.water]]
name = "sea"
source = "usgs"
site = "11455780"     # Suisun Bay at Benicia Bridge
parameter = "suspended_sediment_upper"
mean_with = "suspended_sediment_lower"
hold = "mean_25h"

# Measured turbidity to check GTM's SSC against, through the same relations
# for each station's part of the Delta (Achete et al. 2015, section 4.5:
# central/western a = 0.91, b = 0.29; central/eastern a = 0.72, b = 0.26;
# eastern a = 0.914, b = 0.29). Which part each station is in is FDMR's
# reading of the paper's areas, not the paper's own list. Rio Vista and
# Mallard Island are two of the paper's own three check stations.
[[sediment_checks]]
name = "Sacramento R at Rio Vista"
output = "RVB"
channel = 430
distance = 8399
source = "cdec"
site = "RVB"          # NTU
duration = "E"
parameter = "turbidity_ntu"
relation = { a = 0.85, b = 0.35, area = "north" }

[[sediment_checks]]
name = "Sacramento R at Mallard Island"
output = "MAL"
channel = 437
distance = 9033
source = "cdec"
site = "MAL"          # NTU
duration = "E"
parameter = "turbidity_ntu"
relation = { a = 0.91, b = 0.29, area = "central/western" }

[[sediment_checks]]
name = "Holland Cut near Bethel Island"
output = "HOL"
channel = 117
distance = 3584
source = "cdec"
site = "HOL"          # FNU
duration = "E"
parameter = "turbidity_fnu"
relation = { a = 0.72, b = 0.26, area = "central/eastern" }

[[sediment_checks]]
name = "Old River at Highway 4"
output = "OH4"
channel = 90
distance = 2081
source = "cdec"
site = "OH4"          # FNU
duration = "E"
parameter = "turbidity_fnu"
relation = { a = 1.16, b = 0.27, area = "southern" }

[[sediment_checks]]
name = "Turner Cut near Holt"
output = "TRN"
channel = 172
distance = 1571
source = "cdec"
site = "TRN"          # FNU
duration = "E"
parameter = "turbidity_fnu"
relation = { a = 0.914, b = 0.29, area = "eastern" }
