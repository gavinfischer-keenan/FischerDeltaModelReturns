# Where a pool lies, for drawing its water, where the junctions it joins do not
# say: a pool joined at one point on its edge would otherwise be drawn about
# that point, half off its water. Each is the centroid of the USGS National
# Hydrography Dataset's waterbody outline (Waterbody - Large Scale, read 26 Nov
# 2026; ref:nhd).
[pool_centres]
clifton_court = { lon = -121.5754, lat = 37.8386 }   # "Clifton Court Forebay", 8.96 km2 (DSM2: 8.53)
liberty = { lon = -121.6796, lat = 38.2788 }         # Liberty Island's flooded area, unnamed, 12.9 km2

# Where each pool's water is mapped, so the map draws what is in a pool on its
# water (fdmr_runner.pool_water, which writes pool_water.json). Each chosen by
# hand from the map sources there, 28 Nov 2026: OpenStreetMap elements (ref:osm)
# or the NHD waterbody holding a point (ref:nhd). The tool prints each one's
# mapped area beside DSM2's. Mildred Island, Little Franks Tract, Decker
# Island, Tule Red and Yolo Flyway have no outline of their own in either
# source (Mildred and Little Franks lie inside larger river areas; the last
# three are restorations newer than the maps): they keep a disc about their size.
[pool_water]
franks_tract = { osm = ["relation/2110099"] }                 # "Franks Tract"
clifton_court = { osm = ["way/4909086"] }                     # "Clifton Court Forebay"
discovery_bay = { osm = ["relation/11837351", "way/4909024", "relation/1240908", "way/4908684"] }  # the town's lagoons, Willow Lake and Lido Bay
liberty = { nhd_at = { lon = -121.6796, lat = 38.2788 } }     # the waterbody pool_centres.liberty is the centroid of

# DSM2's external flows that are exports: water pumped out of the Delta, which a
# release can be carried into (Phase 2's "toward the pumps"). Name in DSM2, and
# the words shown for it. Every other withdrawal (farm intakes, small
# diversions) is counted together as "taken by other diversions".
[exports]
swp = "State Water Project pumps (Banks)"
cvp = "Central Valley Project pumps (Jones)"
ccc = "Contra Costa Water District, Rock Slough"
cccoldr = "Contra Costa Water District, Old River"
ccw = "Contra Costa Water District, Victoria Canal"
north_bay = "North Bay Aqueduct"

# Water sources (specification 7.5): each group's inflows, by DSM2's own names
# (regular expressions allowed). QUAL tracks each group as a tracer held at 100
# where it enters, giving the share of every channel's water from it. Treatment
# plant discharges belong to no group.
[fingerprint]
sac = ["sac", "yolo", "yolo_toe"]
sjr = ["vernalis"]
east = ["calaveras", "cosumnes", "moke"]
sea = ["mtz"]
ag = ["dicu_drain_.*", "bc_150", "bc_151"]

# Water temperature (specification 7.5): QUAL's heat budget, on live weather.
# DWR's temperature study reads a weather file its public release leaves out
# (25 Nov 2026), so the study is written afresh (fdmr_plugins.dsm2.temperature).
# QUAL takes one weather for the whole Delta: the mean of these airports,
# around it to the north, east and west. NOAA's hourly archive (GHCNh) covers
# the past and runs about four days behind; the Weather Service's observations
# of the same airports cover the last week.
[temperature]
stations = [
  { ghcnh = "USW00023232", nws = "KSAC", name = "Sacramento Executive Airport" },
  { ghcnh = "USW00023237", nws = "KSCK", name = "Stockton Metropolitan Airport" },
  { ghcnh = "USW00023202", nws = "KSUU", name = "Travis Air Force Base" },
  # The SF Bay estuarine reserve's Rush Ranch weather station in Suisun Marsh,
  # through NOAA NDBC (SFXC1; added 26 Nov 2026, issue #8): air temperature,
  # dew point, wind and pressure, the marsh's own; no cloud.
  { ndbc = "SFXC1", name = "Rush Ranch (SF Bay NERR)" },
]
# Past now, the Weather Service's forecast for the grid cell at 38.1 N 121.6 W
# (the central Delta), about 7 days; then its last day over again.
forecast = { office = "MTR", x = 116, y = 114 }

# Each inflow's water temperature: a series, and the inflows that take it (by
# DSM2's own names, regular expressions allowed); "*" takes the rest, such as
# treatment plant discharges. "drainage" is a stand-in: the air's daily mean
# temperature for water run off fields (DWR uses a monthly pattern it does not
# publish).
[temperature.inflows]
sac = ["sac", "*"]
yolo = ["yolo", "yolo_toe"]
sjr = ["vernalis"]
sea = ["mtz"]
east = ["moke", "cosumnes"]
calaveras = ["calaveras"]
drainage = ["dicu_drain_.*", "bc_150", "bc_151"]

# QUAL's heat-budget constants: the Delta's place (degrees, west positive, and
# the Pacific time zone's meridian), elevation (ft), and QUAL2E's textbook
# values for dust in the air and evaporation (ft/hr/inHg, and per mph of wind;
# ref:brown1987qual2e).
[temperature.scalars]
lat = 38.05
long = 121.6
long_std_merid = 120.0
elev = 5.0
dust_attcoeff = 0.06
evapcoeff_a = 0.00068
evapcoeff_b = 0.00027

# Water temperature where each inflow enters (CDEC, degC), as DWR's own study
