# The Bay reach (specification 7.3): NOAA's San Francisco Bay forecast system
# (SFBOFS, an FVCOM model), fetched each cycle, cut where the rivers narrow
# east of Chipps Island and past the Golden Gate, and coarsened for the compute
# engine. Data only.

reach = "bay"
ofs = "sfbofs"
cycles = [3, 9, 15, 21]   # UTC hours of NOAA's cycles
forecast_hours = 48       # each cycle's forecast reaches this far
days_back = 14            # the past published, like the Delta's

# Past NOAA's forecast the Bay is carried on to the Delta's 14 days by a fit
# (fdmr_plugins.fvcom.extend): at every node, tides plus a drift that grows
# with Delta outflow, fitted to a year of NOAA's archive every 2 hours (chosen
# 25 Nov 2026: covers wet and dry seasons; 73 GB fetched once, about 280 MB
# kept). Delta outflow: CDEC's daily net Delta outflow index (station DTO).
[extension]
fit_days = 365
fit_every_h = 2
outflow = { source = "cdec", site = "DTO", duration = "D", parameter = "net_outflow" }

# NOAA's net flow at Chipps Island is set by its own open tidal boundary near
# Rio Vista, not by the river: checked 25 Nov 2026 on NOAA's own fine mesh, it
# draws about 1,200 m3/s inland past Chipps and Benicia alike over two tidal
# days (storage east of Chipps took only 27 m3/s of it; the rest leaves at its
# eastern boundary, which swings +-6,300 m3/s with the tide), against a measured
# Delta outflow of about 290 m3/s seaward. Every published hour is therefore
# given a potential flow from the join's edges to the sea, so that its flow
# across the join is DSM2's at that hour, tide and net alike
# (fdmr_runner.bay.correct_outflow): the same water crosses from both sides.
# Checked 25 Nov 2026 on 12-25 Nov: DSM2's tide at Rio Vista and Jersey Point
# matches USGS's measured flow (correlation 0.955 and 0.975, 97% and 88% of
# its size), so DSM2's is the flow kept at the join.

# The mesh: NOAA's triangles kept between these longitudes. East of
# `east_of` is the Delta's (DSM2's); west of `west_of` is open ocean too far
# out to matter. The cut crosses each river where it has narrowed to one
# channel: the Sacramento past Collinsville, the San Joaquin at Antioch, and
# the south channel by Pittsburg. Moved there from Chipps Island (-121.915) on
# 25 Nov 2026 (issue #2): east of Chipps the open water around Browns Island,
# Winter Island and New York Slough was only DSM2's channel lines, so it was
# drawn and tracked as lines through open water. Now every stretch of open
# water is the mesh's and the network keeps only channels (38 of DSM2's
# channels are the mesh's, 23 before). The join being nearer NOAA's eastern
# boundary does not matter for the flow across it, which is DSM2's every hour
# (below).
[mesh]
east_of = -121.79
west_of = -122.75
# Coarse node spacing: k times the size of NOAA's own triangles there, within
# these limits (m). 2, 80 and 2500 give 5,317 nodes and 9,265 triangles over
# 99% of NOAA's water area, with Carquinez Strait several triangles wide
# (checked 25 Nov 2026); NOAA's mesh has 54,120 nodes.
k = 2.0
min_m = 80.0
max_m = 2500.0

# Edges where water leaves the Bay for the ocean: west of the Golden Gate and
# deeper than the coast there.
[mesh.open_sea]
west_of = -122.52
deeper_than_m = 15.0

# Edges on the cut hand over to the Delta (region.toml's delta-to-bay
# handoff): the boundary edges within about a kilometre of it.
[[mesh.handoffs]]
id = "delta"
east_of = -121.802

# Salinity and temperature: NOAA's, corrected each day by the stations'
# measured misfit (fdmr_runner.bay.correct_quality). NOAA's Bay reads far too
# salty from Carquinez Strait into Suisun Bay (31 psu at Martinez against 14
# measured, issue #6). Each day, at each station, the measured daily mean less
# NOAA's at the station's node is spread over the mesh along the water,
# weighted by inverse distance squared; past the last measured day each
# station's mean misfit over its last three days is held. The summary in the
# index gives each station's mean misfit, and the miss left there when the
# correction is made from the other stations alone.
#
# Measured values are depth means where a station has two sensors (the mean of
# the upper and lower), like the model's depth-averaged fields. Conductance is
# turned to salinity by PSS-78. Stations and sensors: USGS's San Francisco Bay
# continuous network and CDEC, checked 25 Nov 2026; coordinates from USGS
# monitoring-locations and CDEC station pages.
[quality]
near_m = 2000.0  # a station further than this from every node is not used

[[quality.stations]]
source = "usgs"
site = "11455780"
name = "Suisun Bay at Benicia Bridge"
lon = -122.1266
lat = 38.0449
conductance = ["specific_conductance_upper", "specific_conductance_lower"]
temperature = ["water_temperature_upper", "water_temperature_lower"]

