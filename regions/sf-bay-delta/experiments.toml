[[experiment]]
name = "suisun-gates-2023"
title = "Suisun Marsh Salinity Control Gates, summer 2023"
what = "In a wet year, under a new requirement of the State Water Project's incidental take permit (to use 100 thousand acre-feet of water to freshen the marsh for Delta smelt), DWR put the Montezuma Slough flashboards in early on 14 August 2023 and ran two of the three gates with the tide from 15 August until the water was used, on 18 October. The gates were then left open until they were closed for repairs on 6 November. Without the action the gates stand open with the flashboards out, as from 11 June."
refs = ["hartman2026smscg", "dwr2026dsm2input"]
run_from = "2022-12-01"
judge_from = "2023-06-01"
judge_to = "2023-12-01"
effect_from = "2023-08-14"
effect_to = "2023-11-06"

[[experiment.scenario]]
name = "as-built"
label = "as it was: gates operated"

[[experiment.scenario]]
name = "no-action"
label = "gates left open, flashboards out"
without = true
# As DWR's inputs write the open spell from 11 June 2023: two radial gates open
# (1, at 0.667 both ways; gate 1 stayed shut all year), flashboards out (1),
# boat lock shut (0). Flashboards out until the repair closure of 6 November,
# since they went in early only for the action.
override = [
  { path = "/HIST+GATE/MTZSL/RADIAL_OP//IR-DECADE/DWR-ESO/", value = 1.0, from = "2023-08-14", to = "2023-10-19" },
  { path = "/HIST+GATE/MTZSL/RADIAL_FRACT_UP//IR-DECADE/DWR-ESO/", value = 0.667, from = "2023-08-14", to = "2023-10-19" },
  { path = "/HIST+GATE/MTZSL/FLASHBOARD_OP//IR-DECADE/DWR-ESO/", value = 1.0, from = "2023-08-14", to = "2023-11-06" },
  { path = "/HIST+GATE/MTZSL/BOATLOCK_OP//IR-DECADE/DWR-ESO/", value = 0.0, from = "2023-08-14", to = "2023-11-06" },
]

