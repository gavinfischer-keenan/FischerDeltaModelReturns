[[experiment]]
name = "suisun-gates-2018"
title = "Suisun Marsh Salinity Control Gates, summer 2018"
what = "In August 2018 DWR and Reclamation ran the Montezuma Slough gates with the tide for the first time in summer, to draw fresher water into Suisun Marsh for Delta smelt (flashboards in 27 July; gates operated 2 August to 7 September; usual operations from 17 October). Without the action the gates stand open with the flashboards out until the October season."
refs = ["hartman2026smscg", "dwr2026dsm2input"]
run_from = "2017-12-01"
judge_from = "2018-06-01"
judge_to = "2018-12-01"
effect_from = "2018-07-27"
effect_to = "2018-10-17"

[[experiment.scenario]]
name = "as-built"
label = "as it was: gates operated"

[[experiment.scenario]]
name = "no-action"
label = "gates left open, flashboards out"
without = true
# Open as DWR's inputs write it in the open spells of 2018 and summer 2017:
# radial gates open (1) at full fraction both ways, flashboards out (1), boat lock shut (0).
override = [
  { path = "/HIST+GATE/MTZSL/RADIAL_OP//IR-DECADE/DWR-ESO/", value = 1.0, from = "2018-07-27", to = "2018-10-17" },
  { path = "/HIST+GATE/MTZSL/RADIAL_FRACT_UP//IR-DECADE/DWR-ESO/", value = 1.0, from = "2018-07-27", to = "2018-10-17" },
  { path = "/HIST+GATE/MTZSL/RADIAL_FRACT_DOWN//IR-DECADE/DWR-ESO/", value = 1.0, from = "2018-07-27", to = "2018-10-17" },
  { path = "/HIST+GATE/MTZSL/FLASHBOARD_OP//IR-DECADE/DWR-ESO/", value = 1.0, from = "2018-07-27", to = "2018-10-17" },
  { path = "/HIST+GATE/MTZSL/BOATLOCK_OP//IR-DECADE/DWR-ESO/", value = 0.0, from = "2018-07-27", to = "2018-10-17" },
]

