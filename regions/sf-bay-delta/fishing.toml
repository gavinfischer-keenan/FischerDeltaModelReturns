# The sturgeon forecast (issue #19): where, over the next 14 days, the water
# the model predicts suits the region's sturgeon, from published evidence
# only. Data only; fdmr_runner.fishing applies it to each cycle. Every number
# here is a source's, with where in it, or is marked as FDMR's reading of a
# source, with how strong the evidence is. Nothing is fitted to catches.
#
# What is NOT used, and why: turbidity, tide stage and current speed (no
# quantified relation to sturgeon presence or catch in this estuary was found;
# Patton et al. 2020 could not test tide, p. 7); the anglers' location codes
# (CDFW Report Card) have no published shapes to map onto the model.
# Validation: no daily catch or presence data are published. CDFW's adult
# sturgeon trammel-net sets (Aug-Oct, with salinity and temperature per set)
# and the Report Card's raw daily records (on request from CDFW) are the
# candidates; until one is in hand this forecast is unvalidated, and says so.

[white_sturgeon]
name = "White sturgeon"
status = "catch and release only; season closed 1 July to 30 September (California Fish and Game Commission rules for a CESA candidate species, ref:cdfw_sturgeon_regs)"
reaches = ["delta", "bay"]   # where its daily score is given (salinity and temperature from the model)
# Season: the share of the Report Card's white sturgeon catch in each month,
# 2007-2023 mean (Hause et al. 2024, ref:hause2024, figure 12, read from the
# figure to about 0.3 percentage points), divided by its largest (March). Not
# corrected for effort, which CDFW does not publish (p. 15). Months the season
# is closed score 0.
monthly_catch_percent = [11.0, 13.5, 15.3, 10.7, 5.2, 2.9, 1.8, 1.4, 2.7, 8.4, 13.7, 13.0]
closed_months = [7, 8, 9]
# Salinity (psu, the day's mean): FDMR's bands from the habitat classes of
# Sellheim et al. 2022 (ref:sellheim2022; fresh < 0.5, low 0.5-2, medium 2-10,
# high > 10 psu; "medium" most used, 48-75% of each year to age 18, and
# excursions above 10 brief), with setline catches up to about 16 ppt (Patton
# et al. 2020, ref:patton2020, results p. 5) and adults tolerating 35 ppt
# (McEnroe and Cech 1985, ref:mcenroe1985). Moderate to weak evidence: the
# classes describe lifetime habitat use, not where fish are caught.
salinity_bands = [
  { below = 0.5, score = 0.4, score_in_migration = 0.7 },
  { below = 10.0, score = 1.0 },
  { below = 16.0, score = 0.7 },
  { below = 25.0, score = 0.4 },
  { below = 99.0, score = 0.2 },
]
migration_months = [11, 12, 1, 2, 3, 4, 5]   # fresh water scores higher: the spawning run (Heublein et al. 2017, ref:heublein2017, pp. 12, 26)
# Temperature: catches were made across 9-24 degC (Patton et al. 2020, results
# p. 5). Outside it the model does not score lower (no evidence of
# avoidance); the place is flagged "outside the temperatures fish were caught in".
caught_temperature_c = [9.0, 24.0]
# The spawning run: upstream movement "often stimulated by small increases in
# river flow" (Schaffter 1997, ref:schaffter1997), and spawning followed
# increases of about 40 m3/s (Heublein et al. 2017, p. 28). A day whose mean
# flow at a river reach's end rises this much over the day before, in the
# migration months, is flagged. Weak evidence: the size and the day-over-day
# timescale are FDMR's reading; not calibrated.
migration_rivers = ["river", "san_joaquin"]
migration_rise_m3s = 40.0

[green_sturgeon]
name = "Green sturgeon"
status = "federally threatened (ref:fr2006_green_sturgeon); in California it may not be taken or possessed, nor removed from the water, and is to be released at once (14 CCR 5.81, ref:ccr14_581). Shown so it can be avoided."
reaches = ["delta", "bay"]
# In the estuary from spring through autumn (Kelly et al. 2007,
# ref:kelly2007); in the lower estuary more often February-March and
# June-September, present all months (Chapman et al. 2019, ref:chapman2019).
# FDMR flags April-October, and February-March.
months = [2, 3, 4, 5, 6, 7, 8, 9, 10]
# The ranges they were tracked in (Kelly et al. 2007; Moser and Lindley 2007,
# as compiled by Heublein et al. 2017, p. 21): 11.9-21.9 degC, 8.8-32.1 ppt.
# Ranges observed, not preferences: Kelly et al. found "no apparent
# preferences".
temperature_c = [11.9, 21.9]
salinity_psu = [8.8, 32.1]
