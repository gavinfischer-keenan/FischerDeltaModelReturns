# Dams, pumping plants and gates (specification 3.5), with their latest
# readings from CDEC: what each one releases, pumps or lets through. `show`
# names the readings, `duration` the CDEC series (H hourly, D daily; a daily
# value is the day's mean and is posted the next day). Sensors and units
# checked on CDEC 25 Nov 2026. A gate's `state` is read from the flow through
# it by the Delta model's own rule for it (dsm2.toml [[live_gate]]); the
# reading it rests on must be among those shown.
# No live data was found for the Montezuma Slough Salinity Control Gates or the
# South Delta temporary barriers; they are not shown until a source is.

[[structures]]
id = "shasta"
kind = "dam"
name = "Shasta Dam"
site = "SHA"
lat = 40.718
lon = -122.42
duration = "H"
show = ["reservoir_outflow", "reservoir_inflow", "reservoir_storage"]

