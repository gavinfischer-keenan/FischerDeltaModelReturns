# What can be drawn over the water (specification 3.5, 5.3). Each overlay is
# switched on and off by the visitor; this file says what each one is here.

# X2: how far the sea reaches inland. Jassby et al. (1995) define it as the
# distance from the Golden Gate, along the axis of the estuary, to where the
# daily averaged salinity 1 m above the bed is 2 (psu). DWR's operational
# daily X2 (CDEC "CX2") places it where surface specific conductance is
# 2.64 mS/cm, interpolated between Martinez (56 km), Port Chicago (64),
# Chipps Island / Mallard (74) and Collinsville (81). We follow DWR: QUAL's
# conductance matches the stations' east of Martinez to a few per cent
# (checked 25 Nov 2026), while NOAA's Bay salinity reads far too salty there
# (issue #6). DSM2 begins at Martinez, so an X2 west of it is not placed.
#   Jassby, A.D., et al. 1995. Isohaline position as a habitat indicator for
#   estuarine populations. Ecological Applications 5(1): 272-289.
#   Mueller-Solger, A. 2012. Notes on estimating X2 (draft, IEP), which
#   records CDEC's CX2 method and these station distances.
[[isohalines]]
id = "x2"
reach = "delta"
field = "ec"
threshold = 2640.0  # uS/cm, DWR's CX2 threshold
# Checked every day against the same position worked out from the stations'
# measured surface conductance, by CX2's method (linear between the stations
# either side), over the anchors and Port Chicago at its place on our axis.
# CDEC's own CX2 is posted only between 56 and 81 km (its "v" flag), and the
# autumn's X2 lies beyond Collinsville, so Emmaton (92 km) is included.
check = { source = "cdec", parameter = "specific_conductance", also = ["PCT"] }
# Distances from the Golden Gate (km) at stations on the axis. The axis is the
# network's shortest path from the first to the last; between anchors,
# distance along it is scaled to these. Coordinates: CDEC station metadata.
# Port Chicago is not an anchor: it was moved upstream in 2019 (CDEC).
anchors = [
  { site = "MRZ", name = "Martinez", lon = -122.140488, lat = 38.027637, km = 56 },
  { site = "MAL", name = "Mallard Island (Chipps Island)", lon = -121.920090, lat = 38.042805, km = 74 },
  { site = "CLL", name = "Collinsville", lon = -121.850123, lat = 38.073981, km = 81 },
  { site = "EMM", name = "Emmaton", lon = -121.738924, lat = 38.084272, km = 92 },
  { site = "RVB", name = "Rio Vista Bridge", lon = -121.686355, lat = 38.159737, km = 100 },
]

