# The Rhine-Meuse delta, the Netherlands: the model's second region (issue
# #23), to prove it is not tied to one place. Data only.
#
# Stage 1 (26 Nov 2026): its live stations are recorded, every 10 minutes,
# from Rijkswaterstaat's open data (ref:rws_ddapi; fdmr_adapters.rws).
# Stage 2 (27 Nov 2026): three river reaches run and publish, the Waal, the
# Nederrijn-Lek and the IJssel, each from its first discharge gauge below the
# Rhine's splits (below).
#
# What porting here showed was tied to the United States, and how each is met:
# - river geometry came only from the USGS's national river network (NLDI on
#   NHDPlus): a reach may now take its line from Rijkswaterstaat's waterway
#   network or OpenStreetMap (`line`), checked against the river kilometres;
# - river channels took their shape only from USGS's field measurements at
#   each gauge, which Rijkswaterstaat does not publish: a gauge may now give
#   its main channel's sourced width, slope and roughness (`channel`);
# - the tidal network model: DWR's DSM2 runs the Bay-Delta, but no open model
#   of the Rhine-Meuse delta's channels can be had. Rijkswaterstaat's D-Flow FM
#   schematizations are released only on request, for its own tasks (checked
#   26 Nov 2026), so a network model here must be built from open data;
# - the datum (NAP), the time zone (Rijkswaterstaat's fixed +01:00) and the
#   units (cm, mg/L chloride) are handled by the adapter.

id = "rhine-meuse"
name = "Rhine-Meuse delta, Lobith and Eijsden to the North Sea"
timezone = "Europe/Amsterdam"

# The map: a Protomaps extract (fdmr_runner.basemap), from the North Sea off
# the delta to Lobith, and from Eijsden to the IJssel's mouth at Kampen.
[basemap]
bbox = [3.3, 50.65, 6.35, 52.75]   # west, south, east, north
maxzoom = 15

# Each: site (Rijkswaterstaat's code), what it is, and the quantities read
# (fdmr_adapters.rws.QUANTITIES); `forecasts`, Rijkswaterstaat's own
# (about 31 hours for rivers, 48 for tidal stations); `depth_cm` for a
# water-quality station measuring at several depths, applied to its chloride
# and temperature (`depth_for` to change which). Chosen from the stations
# live on 26 Nov 2026; the discharges balance at each split (Lobith 2035 =
# Waal 1534 + Pannerdensch Kanaal 491; the canal 491 = Nederrijn 210 + IJssel 287).
# ---- River reaches (stage 2). Each starts at its first discharge gauge below
# a split, as a reach with no dam does in the Bay-Delta; the Boven-Rijn's
# three-way split at the Pannerdensche Kop and IJsselkop is not carried across
# yet (a reach hands its water to one reach only). Lines from Rijkswaterstaat's
# national waterway network (NWB Vaarwegen on PDOK, CC0; ref:pdok_nwb_vaarwegen;
# fdmr_runner.geometry `line`), each checked against the river-kilometre markers
# of the same network (the reach's .json, `river_km_check`).
#
# Channel shapes: Rijkswaterstaat publishes no field measurements of area and
# width against flow, so each gauge's channel is a wide main channel of the
# river's normalized width, bed slope and calibrated main-channel Chezy
# coefficient (fdmr_plugins.river_routing.channel.wide_channel; registered
# maths "wide-channel-uniform-flow"). Limits, all stated: the width is held,
# so floodplain flow above bankfull (a Lobith discharge of about 5000 m3/s,
# Gensen et al. 2022, ref:gensen2022) is not represented; the groyne fields'
# share of the flow is left out; and at low flow the Nederrijn-Lek's weirs
# (Driel, Amerongen, Hagestein) hold the water in pools, deeper and slower
# than uniform flow gives, so its speeds there run high. The Chezy values are
# Huyskens and Barneveld's 1994 calibration (ref:huyskens1994), before Room
# for the River and the bed's later incision.

[[reaches]]
id = "waal"
name = "Waal, Millingen to Gorinchem"
kind = "river-routing"
line = { source = "pdok", names = ["Waal"], end = [4.975, 51.830], bbox = [4.9, 51.75, 6.1, 51.95], max_snap_m = 600 }
mouth = [4.975, 51.830]   # where the Waal becomes the Boven-Merwede, at Gorinchem: tidal below
certainty = { solid_days = 1, floor = 0.2 }   # certainty 1 for a day: Rijkswaterstaat's discharge forecasts reached about 27 hours ahead when this was set (27 Nov 2026), and never past what they actually cover; then falling to 0.2 at day 14, every reach's starting floor, set by hand (specification 8.2)
maths = { channel = "wide-channel-uniform-flow" }   # no field measurements here (the registered alternative)
# Groyne fields (issue #27; fdmr_plugins.river_routing.storage): the branch's dead-zone ratio beta and its mean
# velocity head u^2/2g, m, against the discharge at Lobith, read from van Mazijk 1996 (ref:vanmazijk1996), Figs
# 4.4.10/4.4.12/4.4.13 (solid lines, the restriction beta_i <= 0.5, +-0.005) and Fig. 4.4.15 (+-0.001 m).
groyne_fields = { source = "rws", site = "lobith.bovenrijn.tolkamer", beta = [[900, 0.160], [1700, 0.185], [2100, 0.205], [2300, 0.212], [2500, 0.228], [2750, 0.252], [2950, 0.262], [3250, 0.255]], velocity_head_m = [[900, 0.030], [1000, 0.033], [1400, 0.044], [1800, 0.052], [2300, 0.059], [2400, 0.061], [2750, 0.068], [3000, 0.071]] }

[[reaches]]
id = "nederrijn"
name = "Nederrijn and Lek, Arnhem to Hagestein"
kind = "river-routing"
# Rijkswaterstaat's network follows the shipping route, which leaves the river
# through the lock channels beside the Driel, Amerongen and Hagestein weirs (gaps
# of 2.2-2.8 km, and crossing them straight takes the line 1.4 km off the Driel
# gauge): this reach's line is OpenStreetMap's main stream instead (ref:osm;
# ODbL, so its .json is too), still checked against Rijkswaterstaat's kilometres.
line = { source = "osm", names = ["Nederrijn", "Lek"], end = [5.1352, 51.9895], bbox = [5.05, 51.9, 6.0, 52.05], max_snap_m = 600, km_markers = "pdok" }
mouth = [5.1352, 51.9895]  # the Hagestein weir: tidal below
certainty = { solid_days = 1, floor = 0.2 }
maths = { channel = "wide-channel-uniform-flow" }   # no field measurements here (the registered alternative)
# Groyne fields (issue #27; fdmr_plugins.river_routing.storage): the branch's dead-zone ratio beta and its mean
# velocity head u^2/2g, m, against the discharge at Lobith, read from van Mazijk 1996 (ref:vanmazijk1996), Figs
# 4.4.10/4.4.12/4.4.13 (solid lines, the restriction beta_i <= 0.5, +-0.005) and Fig. 4.4.15 (+-0.001 m).
groyne_fields = { source = "rws", site = "lobith.bovenrijn.tolkamer", beta = [[900, 0.290], [1700, 0.300], [2100, 0.310], [2400, 0.320], [2800, 0.338], [3000, 0.340], [3250, 0.330]], velocity_head_m = [[900, 0.003], [1000, 0.003], [1400, 0.004], [1800, 0.008], [2300, 0.030], [2400, 0.032], [2750, 0.040], [3000, 0.043]] }

[[reaches]]
id = "ijssel"
name = "IJssel, Westervoort to the Ketelmeer"
kind = "river-routing"
line = { source = "pdok", names = ["Geldersche IJssel"], end = [5.84, 52.59], bbox = [5.75, 51.9, 6.3, 52.65], max_snap_m = 600 }
mouth = [5.84, 52.59]      # the Ketelmeer
certainty = { solid_days = 1, floor = 0.2 }
maths = { channel = "wide-channel-uniform-flow" }   # no field measurements here (the registered alternative)
# Groyne fields (issue #27; fdmr_plugins.river_routing.storage): the branch's dead-zone ratio beta and its mean
# velocity head u^2/2g, m, against the discharge at Lobith, read from van Mazijk 1996 (ref:vanmazijk1996), Figs
# 4.4.10/4.4.12/4.4.13 (solid lines, the restriction beta_i <= 0.5, +-0.005) and Fig. 4.4.15 (+-0.001 m). Its measured lags
# are about zero (Tables 4.4.6-4.4.7), so the piece runs 0.25 late here: kept, as everywhere, not tuned for one branch.
groyne_fields = { source = "rws", site = "lobith.bovenrijn.tolkamer", beta = [[900, 0.200], [1700, 0.208], [2300, 0.220], [2500, 0.235], [2900, 0.280], [3250, 0.280]], velocity_head_m = [[900, 0.016], [1000, 0.018], [1400, 0.025], [1800, 0.029], [2300, 0.032], [2400, 0.033], [2750, 0.037], [3000, 0.039]] }

# The Meuse (Eijsden to Lith) waits: no verified main-channel width was found
# for its Grensmaas and Bedijkte Maas stretches (issue #23).

# Kampen, the IJssel's last discharge station in Rijkswaterstaat's catalogue,
# returned no live values on 26 Nov 2026: the IJssel runs from Olst to its mouth
# on Olst's flow, routed.

# Discharge gauges (Rijkswaterstaat; ETRS89 positions from its catalogue), each
# with its channel: width (Visser 2000, ref:visser2000, table 2.1 and pp. 42-49),
# bed slope (Visser 2000, citing Rijkswaterstaat 2000) and main-channel Chezy
# C, m^0.5/s (Huyskens and Barneveld 1994, tables 3.6, 3.13, 3.22: the middle
# of each branch's range from low flow to bankfull).
[[gauges]]
reach = "waal"
site = "millingenaanderijn"
name = "Waal at Millingen aan de Rijn"
role = "release"
source = "rws"
lon = 6.0348
lat = 51.873
channel = { width_m = 260, slope = 1.1e-4, chezy = 45 }   # Waal: 260 m (Visser table 2.1, p. 6); 1.1e-4 (p. 49); C 41-49 low flow to bankfull (Huyskens table 3.6)

[[gauges]]
reach = "waal"
site = "tiel.waal"
name = "Waal at Tiel"
role = "main"
source = "rws"
lon = 5.4407
lat = 51.8824
channel = { width_m = 260, slope = 1.1e-4, chezy = 45 }

[[gauges]]
reach = "nederrijn"
site = "arnhem.nederrijn"
name = "Nederrijn at Arnhem"
role = "release"
source = "rws"
lon = 5.912
lat = 51.9754
forecast = { source = "rws" }
channel = { width_m = 130, slope = 1.26e-4, chezy = 42 }   # Nederrijn: 130 m (Visser table 2.1, p. 7); 1.26e-4 (p. 44); C 37-47 at bankfull (Huyskens table 3.22)

[[gauges]]
reach = "nederrijn"
site = "driel.boven"
name = "Nederrijn at Driel (above the weir)"
role = "main"
source = "rws"
lon = 5.8106
lat = 51.9658
forecast = { source = "rws" }
channel = { width_m = 130, slope = 1.26e-4, chezy = 42 }

[[gauges]]
reach = "nederrijn"
site = "hagestein.boven"
name = "Lek at Hagestein (above the weir)"
role = "main"
source = "rws"
lon = 5.1352
lat = 51.9895
forecast = { source = "rws" }
channel = { width_m = 130, slope = 1.26e-4, chezy = 42 }   # the Lek: the Nederrijn-Lek bed slope is Visser's average IJsselkop to Hagestein

[[gauges]]
reach = "ijssel"
site = "westervoort.1"
name = "IJssel at Westervoort"
role = "release"
source = "rws"
lon = 5.962
lat = 51.9705
channel = { width_m = 80, slope = 1.0e-4, chezy = 41 }   # IJssel at its head: 80 m (Visser p. 42); 1.0e-4 IJsselkop to Wijhe (p. 42); C 37.5-45 at bankfull (Huyskens table 3.13)

[[gauges]]
reach = "ijssel"
site = "olst"
name = "IJssel at Olst"
role = "main"
source = "rws"
lon = 6.1045
lat = 52.342
channel = { width_m = 110, slope = 1.0e-4, chezy = 41 }   # Olst: 110 m (Visser p. 42)

