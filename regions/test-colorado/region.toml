# Region package: Colorado River below Glen Canyon Dam (the test region).
#
# A deliberately plain second region (specification section 4.1, "Keeping it
# honest"): one gauged, non-tidal river outside California, run with only the
# river model and national adapters. If the engine needs changing to run it,
# something regional has leaked into the engine.
#
# Chosen because it is driven by dam releases like the launch region's river,
# has long USGS gauge records, and USGS has measured its travel time and
# dispersion with dye, which gives an independent check. Gauge numbers were
# confirmed against the USGS Water Data API on 25 November 2026.

id = "test-colorado"
name = "Colorado River, Glen Canyon Dam to Grand Canyon"
timezone = "America/Phoenix"

[[reaches]]
id = "river"
name = "Colorado River, Lees Ferry to Grand Canyon"
kind = "river-routing"
certainty = { solid_days = 5, floor = 0.2 }   # as the Sacramento's: about as far as the river forecasts reach, then falling to 0.2 at day 14, every reach's starting floor, set by hand (specification 8.2)

# Gauges, upstream to downstream (USGS site numbers, confirmed 25 Nov 2026).
[[gauges]]
reach = "river"
site = "09380000"
name = "Colorado River at Lees Ferry"
role = "release"

[[gauges]]
reach = "river"
site = "09382000"
name = "Paria River at Lees Ferry"
role = "tributary"

[[gauges]]
reach = "river"
site = "09402000"
name = "Little Colorado River near Cameron"
role = "tributary"

[[gauges]]
reach = "river"
site = "09402500"
name = "Colorado River near Grand Canyon"
role = "main"

# The basemap extract: west, south, east, north (degrees), and the deepest zoom.
[basemap]
bbox = [-112.75, 35.85, -111.35, 36.98]
maxzoom = 15

[guard]
words = ["Colorado", "Glen Canyon", "Lees Ferry", "Grand Canyon", "Paria"]
