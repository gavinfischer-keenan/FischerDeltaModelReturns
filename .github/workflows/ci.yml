name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  seams:
    name: Module seams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -I tools/check_seams.py
      # Every ref:<key> names a reference, every reference is cited, and the
      # references page and the maths document match the code.
      - run: python -I tools/references.py --check
      - run: python tools/maths_doc.py --check
      - run: python tools/params_doc.py --check
      # The runner's shell scripts (ShellCheck comes with the runner image).
      - run: find runner -name '*.sh' -exec shellcheck -S warning {} +

  python:
    name: Python (store, adapters, plug-ins, bindings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      # The project's own dependencies and test extras (pyproject.toml), so no
      # test is skipped for a package left out by hand (#87).
      - run: pip install '.[test]' ../crates/fdmr-py ruff
      - run: python -c "import fdmr_py"
      - run: ruff check --select F,E9 . ../tools
      # -rs: every skipped test says why, in the log.
      - run: python -m pytest -q -rs

  rust:
    name: Rust (math library, published format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  ui:
    name: UI (compute engine in WebAssembly, type check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build crates/fdmr-wasm --target web --release --out-dir ../../ui/src/compute/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: ui
      - run: npx svelte-check --tsconfig ./tsconfig.json
        working-directory: ui
      - run: npx vite build
        working-directory: ui
