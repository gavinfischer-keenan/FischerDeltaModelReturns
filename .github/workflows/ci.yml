name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  seams:
    name: Module seams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -I tools/check_seams.py

  python:
    name: Python (store, adapters, plug-ins, bindings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install pytest h5py pyshp scipy ../crates/fdmr-py
      - run: python -c "import fdmr_py"
      - run: python -m pytest -q

  rust:
    name: Rust (math library, published format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  ui:
    name: UI (compute engine in WebAssembly, type check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: wasm-pack build crates/fdmr-wasm --target web --release --out-dir ../../ui/src/compute/pkg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: ui
      - run: npx svelte-check --tsconfig ./tsconfig.json
        working-directory: ui
      - run: npx vite build
        working-directory: ui
