[workspace]
resolver = "2"
members = ["crates/fdmr-math", "crates/fdmr-format", "crates/fdmr-py", "crates/fdmr-compute", "crates/fdmr-wasm"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false
repository = "https://github.com/gavinfischer-keenan/FischerDeltaModelReturns"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
similar_names = "allow"
